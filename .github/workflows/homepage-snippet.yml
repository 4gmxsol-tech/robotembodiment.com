name: Homepage Snippet Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-snippet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate homepage snippet and sitemap
        run: python scripts/validate_homepage_snippet.py
      - name: Validate homepage brand integrity
        run: python scripts/validate_homepage_brand_integrity.py
      - name: Validate manipulation hub breadcrumbs and discovery signals
        run: python scripts/validate_manipulation_hub.py
