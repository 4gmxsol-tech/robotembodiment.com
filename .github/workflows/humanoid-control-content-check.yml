name: Priority article content checks

on:
  pull_request:
    paths:
      - "articles/humanoid-robot-control.html"
      - "articles/what-is-embodied-ai.html"
      - "articles/robot-manipulation-explained.html"
      - "articles.html"
      - "sitemap.xml"
      - ".github/scripts/test_humanoid_control_article.py"
      - ".github/scripts/test_embodied_ai_article.py"
      - ".github/scripts/test_robot_manipulation_article.py"
      - ".github/workflows/humanoid-control-content-check.yml"
  push:
    branches: [main]
    paths:
      - "articles/humanoid-robot-control.html"
      - "articles/what-is-embodied-ai.html"
      - "articles.html"
      - "sitemap.xml"
      - ".github/scripts/test_humanoid_control_article.py"
      - ".github/scripts/test_embodied_ai_article.py"
      - ".github/workflows/humanoid-control-content-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate humanoid control article content and SEO consistency
        run: python .github/scripts/test_humanoid_control_article.py
      - name: Validate embodied AI article content, sources and internal links
        run: python .github/scripts/test_embodied_ai_article.py
      - name: Validate robot manipulation article content, sources and internal links
        run: python .github/scripts/test_robot_manipulation_article.py
