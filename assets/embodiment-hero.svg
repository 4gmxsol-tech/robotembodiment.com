 <path d="M108 550 70 710h70l52-160M200 550l38 160h-70l-52-160" fill="#aabdc8"/>
 <path d="M40 390h45M260 390h-45" stroke="#31dfff"/>
</g>
<g font-family="system-ui,Segoe UI,Arial" fill="#e9f6ff">
 <text x="72" y="120" font-size="18" letter-spacing="5" fill="#7ddfff">THE EMBODIED AI ECOSYSTEM</text>
 <text x="72" y="190" font-size="66" font-weight="800">Where AI meets</text><text x="72" y="260" font-size="66" font-weight="800" fill="#27cfff">the physical world.</text>
 <text x="72" y="315" font-size="20" fill="#9eb3c6">Robots · Models · Companies · Research</text>
 <g font-size="17" font-weight="700">
  <rect x="1080" y="125" width="235" height="76" rx="18" fill="#09131e" stroke="#43cfff"/><text x="1110" y="158">MODELS</text><text x="1110" y="182" font-size="13" fill="#8ea6b9">foundation intelligence</text>
  <rect x="1110" y="530" width="235" height="76" rx="18" fill="#09131e" stroke="#a779ff"/><text x="1140" y="563">CONTROL</text><text x="1140" y="587" font-size="13" fill="#8ea6b9">action in the world</text>
  <rect x="470" y="120" width="235" height="76" rx="18" fill="#09131e" stroke="#43cfff"/><text x="500" y="153">PERCEPTION</text><text x="500" y="177" font-size="13" fill="#8ea6b9">sensing &amp; understanding</text>
  <rect x="430" y="535" width="235" height="76" rx="18" fill="#09131e" stroke="#45e0bd"/><text x="460" y="568">ROBOTS</text><text x="460" y="592" font-size="13" fill="#8ea6b9">physical embodiment</text>
 </g>
</g>
</svg>