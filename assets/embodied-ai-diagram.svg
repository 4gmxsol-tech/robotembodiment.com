<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="The embodied AI loop"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283618"/><stop offset="1" stop-color="#606c38"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><text x="600" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">Embodied AI: Sense, Decide, Act, Learn</text><g><rect x="90" y="250" width="260" height="220" rx="24" fill="#ffffff"/><text x="220" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">SENSE</text><text x="220" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">body + sensors</text></g><line x1="350" y1="360" x2="430" y2="360" stroke="#14213d" stroke-width="10" stroke-linecap="round"/><polygon points="430,360 402,342 402,378" fill="#14213d"/><g><rect x="430" y="250" width="260" height="220" rx="24" fill="#ffffff"/><text x="560" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">DECIDE</text><text x="560" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">model reasons</text></g><line x1="690" y1="360" x2="770" y2="360" stroke="#14213d" stroke-width="10" stroke-linecap="round"/><polygon points="770,360 742,342 742,378" fill="#14213d"/><g><rect x="770" y="250" width="260" height="220" rx="24" fill="#ffd166"/><text x="900" y="342" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#14213d" text-anchor="middle">ACT</text><text x="900" y="400" font-family="Arial, sans-serif" font-size="30" fill="#14213d" text-anchor="middle">body moves</text></g><text x="600" y="600" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle">Every action teaches the next one:</text><text x="60